name: Release

# Builds Volt on Windows and publishes the installers to a GitHub Release.
#
# Triggered by pushing a `v*` tag. The in-app updater reads
# `GET /repos/{owner}/{repo}/releases/latest` and downloads the `*-setup.exe`
# (falling back to the `.msi`), so a published release is all it needs — no
# Tauri updater manifest is required.
#
# NOTE: the build is produced by the `tauri` CLI directly (the same command
# used locally) and the installers are attached with `softprops/action-gh-release`.
# We deliberately do NOT use `tauri-apps/tauri-action` here: it would run
# `npm run tauri build` from the repo root, where the `@tauri-apps/cli`
# dev-dependency is never installed, and fail after the real build succeeded.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci || npm install

      - name: Build Tauri app
        working-directory: src-tauri
        run: ../ui/node_modules/.bin/tauri build
        env:
          VOLT_GITHUB_REPO: ${{ github.repository }}
          # Optional code signing — set these repo secrets to sign releases:
          # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      - name: Publish GitHub Release
        # Only publish for tag pushes; `workflow_dispatch` runs are build-only.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Volt ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## ⚡ Volt ${{ github.ref_name }}

            ### Downloads
            - **Volt_x64-setup.exe** — Windows installer (recommended)
            - **Volt_x64_en-US.msi** — MSI package

            > Installed copies of Volt will prompt you to update automatically.
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
