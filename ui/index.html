<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volt</title>
    <!-- Static preloader: painted before the JS bundle loads so the window
         never shows a white flash or a blank hang. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0f;
      }
      #volt-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 600px at 12% -10%, hsl(262 100% 65% / 0.1), transparent 60%),
          radial-gradient(1000px 500px at 100% 0%, rgba(56, 189, 248, 0.06), transparent 55%),
          #0a0a0f;
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.18s ease;
      }
      #volt-preloader.vp-hide {
        opacity: 0;
        pointer-events: none;
      }
      .vp-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .vp-logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: hsl(262 100% 65%);
        display: grid;
        place-items: center;
        box-shadow: 0 0 24px hsl(262 100% 65% / 0.45);
      }
      .vp-title {
        font-weight: 700;
        letter-spacing: -0.02em;
        font-size: 18px;
      }
      .vp-hint {
        font-size: 12px;
        color: #64748b;
      }
      .vp-spinner {
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: hsl(262 100% 65%);
        animation: vp-spin 0.8s linear infinite;
      }
      @keyframes vp-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="volt-preloader" role="status" aria-label="Loading Volt">
      <div class="vp-inner">
        <div class="vp-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white" aria-hidden="true">
            <path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z" />
          </svg>
        </div>
        <div class="vp-title">Volt</div>
        <div class="vp-spinner"></div>
        <div class="vp-hint">Starting Volt...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
